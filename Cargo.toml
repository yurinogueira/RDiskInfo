[package]
name = "rdiskinfo"
version = "0.1.0"
edition = "2024"
description = "Cross-protocol Linux S.M.A.R.T. and disk diagnostics viewer inspired by CrystalDiskInfo and QDiskInfo"
license = "GPL-3.0-or-later"
repository = "https://github.com/yurinogueira/RDiskInfo"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
