name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Build & Publish Linux x86_64 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build & validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev \
            desktop-file-utils

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run test suite & desktop validation
        run: |
          cargo test --locked
          desktop-file-validate dist/rdiskinfo.desktop

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          STAGE="rdiskinfo-${TAG}-x86_64-linux"
          mkdir -p "${STAGE}"
          cp target/release/rdiskinfo "${STAGE}/"
          cp dist/rdiskinfo.desktop "${STAGE}/"
          cp src/img/logo-512.png "${STAGE}/rdiskinfo.png"
          cp assets/icon.svg "${STAGE}/rdiskinfo.svg"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdiskinfo-release-archive
          path: |
            rdiskinfo-*-x86_64-linux.tar.gz
            rdiskinfo-*-x86_64-linux.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            rdiskinfo-*-x86_64-linux.tar.gz \
            rdiskinfo-*-x86_64-linux.tar.gz.sha256 \
            --generate-notes
