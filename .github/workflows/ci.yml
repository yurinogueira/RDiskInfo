name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Clippy, Tests & Desktop Entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build & validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev \
            desktop-file-utils

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run test suite
        run: cargo test --locked --verbose

      - name: Validate desktop entry
        run: desktop-file-validate dist/rdiskinfo.desktop

  build-release-and-smoke:
    name: Release Build & Headless Smoke Tests
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build & runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev \
            smartmontools

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run headless CLI & JSON smoke tests
        run: |
          ./target/release/rdiskinfo --help
          ./target/release/rdiskinfo --cli --no-elevate --lang en
          ./target/release/rdiskinfo --cli --no-elevate --lang pt-br
          env -u DISPLAY -u WAYLAND_DISPLAY ./target/release/rdiskinfo --json < /dev/null > /tmp/rdiskinfo_smoke.json
          python3 -m json.tool /tmp/rdiskinfo_smoke.json > /dev/null
          ! ./target/release/rdiskinfo --privileged-helper
          ! ./target/release/rdiskinfo --ascii-view /dev/sda

      - name: Upload Linux release binary
        uses: actions/upload-artifact@v4
        with:
          name: rdiskinfo-linux-x86_64
          path: target/release/rdiskinfo
          retention-days: 7
